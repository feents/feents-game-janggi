# dist/ 내용을 /usr/share/nginx/html에 복사한 뒤 사용하는 정적 서비스 예시.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # AI WASM과 규칙 WASM은 HTML fallback 없이 제공한다.
    location ~* \.wasm$ {
        types { application/wasm wasm; }
        try_files $uri =404;
    }

    # 내용 해시가 파일명에 포함된 모델은 캐시하고, 누락 시 HTML로 대체하지 않는다.
    location ~* "/engine/janggi-[a-f0-9]{12}\.nnue$" {
        types { application/octet-stream nnue; }
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    location /engine/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    location /fonts/ {
        try_files $uri =404;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }
}
